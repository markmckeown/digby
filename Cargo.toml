[package]
name = "digby"
version = "0.3.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
rand = "0.9.2"
tempfile = "3.22.0"
xxhash-rust = { version = "0.8.18", features = ["xxh32", "xxh3"] }
sha2 = "0.10.9"
aes-gcm = "0.10.3"
aes = "0.8.4"
lz4_flex = "0.11.5"
log = "0.4"
thiserror = "1.0"

[dev-dependencies]
env_logger = "0.11"

[lib]
path = "src/lib.rs"
